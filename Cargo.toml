[workspace]
resolver = "2"
members = [
    "crates/vault_core",
    "crates/sync_core",
    "crates/native_bridge",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/llklkl/authenticator"
rust-version = "1.85"

[workspace.dependencies]
aes-gcm = { version = "0.11", features = ["getrandom"] }
async-trait = "0.1"
bip39 = { version = "2.2", default-features = false, features = ["std", "zeroize"] }
data-encoding = "2"
getrandom = "0.4"
hmac = "0.13"
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
sha1 = "0.10"
sha2 = "0.10"
thiserror = "2"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = { version = "1", features = ["derive"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
